<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduPredict AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-[#080A12] text-white">
<nav class="border-b border-white/10 h-16 flex items-center px-6 justify-between backdrop-blur-xl bg-black/20">
  <div class="flex items-center gap-3"><div class="w-9 h-9 rounded-xl bg-gradient-to-br from-violet-600 to-indigo-600 flex items-center justify-center font-bold">E</div><b>EduPredict AI</b></div>
  <span class="text-xs text-white/50">Random Forest • R² 85%</span>
</nav>

<div class="max-w-6xl mx-auto px-6 py-12">
<h1 class="text-5xl font-extrabold leading-tight">Predict your <span class="text-violet-400">academic performance</span> with AI</h1>
<p class="text-white/60 mt-4 max-w-xl">Same model, new premium UI. Enter your data and get instant prediction.</p>

<form action="/predict" method="POST" class="mt-10 grid lg:grid-cols-3 gap-6">
<div class="lg:col-span-2 space-y-6">
<div class="glass-card p-7">
<h3 class="font-bold mb-6">STUDY METRICS</h3>
<div class="grid md:grid-cols-2 gap-6">
<div><label class="field-label">STUDY HOURS</label><input type="number" step="0.5" name="study_hours" value="5" class="input-premium" required></div>
<div><label class="field-label">SLEEP HOURS</label><input type="number" step="0.5" name="sleep_hours" value="7" class="input-premium" required></div>
<div><label class="field-label">ATTENDANCE %</label><input type="number" name="attendance" value="85" class="input-premium" required></div>
<div><label class="field-label">PREVIOUS SCORE %</label><input type="number" name="previous_score" value="75" class="input-premium" required></div>
</div>
</div>

<div class="glass-card p-7">
<h3 class="font-bold mb-6">ENGAGEMENT</h3>
<div class="grid md:grid-cols-2 gap-6">
<div><label class="field-label">CLASS PARTICIPATION (1-10)</label><select name="class_participation" class="input-premium"><option value="8">High</option><option value="6" selected>Medium</option><option value="3">Low</option></select></div>
<div><label class="field-label">EXTRACURRICULAR hrs</label><input type="number" name="extracurricular" value="2" class="input-premium"></div>
<div><label class="field-label">MOTIVATION (1-10)</label><input type="number" name="motivation" value="7" class="input-premium"></div>
<div><label class="field-label">STRESS (1-10)</label><input type="number" name="stress" value="4" class="input-premium"></div>
</div>
</div>
</div>

<div class="lg:col-span-1"><div class="glass-card p-7 sticky top-24">
<h3 class="font-bold mb-3">Ready?</h3>
<p class="text-sm text-white/60 mb-6">Backend unchanged. Only frontend is new.</p>
<button type="submit" class="w-full h-12 rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 font-bold">Predict Performance</button>
</div></div>
</form>
</div>
</body>
</html>
