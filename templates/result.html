<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Result - EduPredict</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-[#080A12] text-white">
<nav class="border-b border-white/10 h-16 flex items-center px-6 justify-between"><a href="/" class="font-bold">EduPredict AI</a><a href="/" class="px-4 py-2 rounded-full bg-white text-black text-sm font-bold">← New Prediction</a></nav>

<main class="max-w-6xl mx-auto px-6 py-10 grid lg:grid-cols-12 gap-6">
<div class="lg:col-span-5 glass-card p-8 text-center">
<p class="text-xs text-white/40 font-bold tracking-widest">PREDICTED SCORE</p>
<div class="w-36 h-36 mx-auto mt-6 rounded-full bg-gradient-to-br from-violet-600 to-indigo-600 flex items-center justify-center text-4xl font-extrabold">{{ prediction }}%</div>
<h2 class="mt-6 text-2xl font-bold">{{ category }}</h2>
<p class="text-white/60 text-sm mt-2">{{ message }}</p>
<a href="/" class="mt-8 block w-full h-11 rounded-xl bg-white text-black font-bold flex items-center justify-center">Predict Again</a>
</div>

<div class="lg:col-span-7 space-y-6">
<div class="glass-card p-6"><h3 class="font-bold mb-4">💡 Personalized Insights</h3>
{% for tip in tips %}
<div class="p-4 rounded-xl bg-white/[0.03] border border-white/10 mb-3 text-sm text-white/80">{{ tip }}</div>
{% endfor %}
</div>
</div>
</main>
</body>
</html>
